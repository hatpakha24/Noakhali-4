<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হাতপাখা পোস্টার মেকার - নোয়াখালী ৪</title>
    
    <!-- ফন্ট লিঙ্কসমূহ -->
    <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'SolaimanLipi', 'Hind Siliguri', sans-serif;
            background-color: #f0f4f8;
        }

        .canvas-container {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 16px;
            overflow: hidden;
            background: white;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        
        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .input-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        .ctrl-btn {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #64748b;
            font-weight: bold;
            min-height: 44px;
            width: 100%;
        }
        .ctrl-btn:hover {
            border-color: #22c55e;
            color: #16a34a;
            background-color: #f0fdf4;
        }
        
        .mode-btn {
            flex: 1;
            padding: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s;
            text-align: center;
        }

        .active-mode { background-color: #22c55e; color: white; }
        .inactive-mode { background-color: #f1f5f9; color: #64748b; }

        .download-btn {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: white;
            font-weight: 800;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(22, 163, 74, 0.4);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- কন্ট্রোল প্যানেল -->
        <div class="w-full lg:col-span-5 flex flex-col gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="border-b border-slate-100 pb-4 mb-6">
                    <h1 class="text-2xl font-black text-slate-800 tracking-tight">হাতপাখা পোস্টার এডিটর</h1>
                    <p class="text-sm text-slate-500 mt-1">ছবি ও পরিচয় দিয়ে প্রচারণা পোস্টার তৈরি করুন</p>
                </div>

                <div id="templateErrorMsg" class="hidden mb-6 p-4 bg-amber-50 border border-amber-200 rounded-xl">
                    <p class="text-xs text-amber-700 font-bold mb-2">💡 ব্যাকগ্রাউন্ড টেমপ্লেট লোড হয়নি। নিচে কোড বসান।</p>
                </div>

                <div class="space-y-5">
                    <div class="bg-green-50 p-4 rounded-xl border border-green-100">
                        <label class="input-label text-green-900">১. আপনার ছবি আপলোড করুন</label>
                        <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-green-600 file:text-white hover:file:bg-green-700 cursor-pointer">
                    </div>

                    <div>
                        <label class="input-label">২. আপনার নাম</label>
                        <input type="text" id="nameInput" placeholder="আপনার পুরো নাম লিখুন" class="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-xl outline-none transition focus:border-green-500 focus:ring-4 focus:ring-green-100 text-lg">
                    </div>

                    <div>
                        <label class="input-label">৩. পদবী বা পরিচয়</label>
                        <input type="text" id="designationInput" placeholder="যেমন: সাধারণ সম্পাদক, ২নং ওয়ার্ড" class="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-xl outline-none transition focus:border-green-500 focus:ring-4 focus:ring-green-100">
                    </div>
                </div>
            </div>

            <!-- কাস্টমাইজেশন টুলস -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex flex-wrap gap-2 mb-4 p-1 bg-slate-100 rounded-xl">
                    <button id="modeName" onclick="setActiveMode('name')" class="mode-btn active-mode">নামের পজিশন</button>
                    <button id="modeDesignation" onclick="setActiveMode('designation')" class="mode-btn inactive-mode">পদবীর পজিশন</button>
                    <button id="modePhoto" onclick="setActiveMode('photo')" class="mode-btn inactive-mode">ছবির পজিশন</button>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">স্থান পরিবর্তন</span>
                        <div class="grid grid-cols-3 gap-1">
                            <div class="h-4"></div> <button onclick="moveElements(0, -5)" class="ctrl-btn">↑</button> <div></div>
                            <button onclick="moveElements(-5, 0)" class="ctrl-btn">←</button>
                            <button onclick="resetSettings()" class="ctrl-btn bg-slate-50">↺</button>
                            <button onclick="moveElements(5, 0)" class="ctrl-btn">→</button>
                            <div></div> <button onclick="moveElements(0, 5)" class="ctrl-btn">↓</button> <div></div>
                        </div>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider" id="resizeLabel">ফন্ট সাইজ</span>
                            <div class="flex gap-2 mt-1">
                                <button onclick="resizeElements(-2)" class="ctrl-btn">ছোট</button>
                                <button onclick="resizeElements(2)" class="ctrl-btn">বড়</button>
                            </div>
                        </div>
                        <button onclick="downloadCard()" class="w-full py-4 rounded-xl download-btn text-lg shadow-lg">
                            পোস্টার ডাউনলোড করুন
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- প্রিভিউ -->
        <div class="w-full lg:col-span-7 flex justify-center sticky top-8">
            <div class="canvas-container">
                <canvas id="cardCanvas"></canvas>
            </div>
        </div>
    </div>

<script>
    /**
     * আপনার দেওয়া নির্দেশ অনুযায়ী ১২/১২ ইঞ্চি টেমপ্লেট হিসাব:
     * ১০৮০ পিক্সেল ক্যানভাসে ১ ইঞ্চি = ৯০ পিক্সেল (১০৮০ / ১২ = ৯০)
     */
    const CONFIG = {
        size: 1080,
        photoArea: {
            w: 408, // 4.5372 inch * 90 = 408.348 (rounded to 408)
            h: 408, // 4.5372 inch * 90 = 408.348 (rounded to 408)
            x: 652, // 7.2406 inch * 90 = 651.654 (rounded to 652)
            y: 652, // 7.2415 inch * 90 = 651.735 (rounded to 652)
            radius: 32 // 0.3522 inch * 90 = 31.698 (rounded to 32)
        },
        nameBox: {
            w: 611, // 6.7925 inch * 90 = 611.325
            h: 82,  // 0.9128 inch * 90 = 82.152
            x: 28,  // 0.3134 inch * 90 = 28.206
            y: 916  // টেমপ্লেট লেআউট অনুযায়ী পজিশন
        },
        designationBox: {
            yOffset: 16 // 0.1821 inch * 90 = 16.389
        }
    };

    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');
    let templateImg = new Image();
    let userImg = null;
    let activeMode = 'name';
    let isTemplateLoaded = false;

    const settings = {
        name: { offsetX: 0, offsetY: 0, sizeOffset: 0, color: '#FFFFFF' },
        designation: { offsetX: 0, offsetY: 0, sizeOffset: 0, color: '#000000' },
        photo: { offsetX: 0, offsetY: 0, scale: 1.0 }
    };

    function initApp() {
        canvas.width = CONFIG.size;
        canvas.height = CONFIG.size;

        templateImg.crossOrigin = "anonymous";
        
        if (typeof base64Template !== 'undefined' && base64Template.length > 100) {
            templateImg.src = base64Template;
        } else {
            // ডিফল্ট টেমপ্লেট লিঙ্ক
            templateImg.src = 'https://i.imgur.com/jBCoTbX.jpg'; 
        }
        
        templateImg.onload = () => { 
            isTemplateLoaded = true;
            const errorDiv = document.getElementById('templateErrorMsg');
            if(errorDiv) errorDiv.classList.add('hidden');
            render(); 
        };
        
        templateImg.onerror = () => { 
            isTemplateLoaded = false;
            const errorDiv = document.getElementById('templateErrorMsg');
            if(errorDiv) errorDiv.classList.remove('hidden');
            render();
        };

        document.getElementById('nameInput').addEventListener('input', render);
        document.getElementById('designationInput').addEventListener('input', render);
        document.getElementById('imageInput').addEventListener('change', handleImage);
        
        if (document.fonts) {
            document.fonts.ready.then(() => { render(); });
        }
    }

    function handleImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => { 
                userImg = img; 
                settings.photo = { offsetX: 0, offsetY: 0, scale: 1.0 };
                render(); 
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function render() {
        ctx.clearRect(0, 0, CONFIG.size, CONFIG.size);
        
        if (isTemplateLoaded && templateImg.complete && templateImg.naturalWidth > 0) {
            ctx.drawImage(templateImg, 0, 0, CONFIG.size, CONFIG.size);
        } else {
            ctx.fillStyle = "#f1f5f9";
            ctx.fillRect(0, 0, CONFIG.size, CONFIG.size);
            ctx.fillStyle = "#94a3b8";
            ctx.font = "40px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("টেমপ্লেট ডাটা নিচে বসান", CONFIG.size/2, CONFIG.size/2);
        }

        if (userImg && userImg.complete) {
            drawUserPhotoSmart();
        }

        drawPostersText();
    }

    function drawUserPhotoSmart() {
        const p = CONFIG.photoArea;
        const s = settings.photo;
        
        ctx.save();
        
        // নির্দিষ্ট ৪০৮x৪০৮ বক্সে মাস্ক তৈরি (আপনার নির্দেশিত মাপ)
        ctx.beginPath();
        ctx.moveTo(p.x + p.radius, p.y);
        ctx.arcTo(p.x + p.w, p.y, p.x + p.w, p.y + p.h, p.radius);
        ctx.arcTo(p.x + p.w, p.y + p.h, p.x, p.y + p.h, p.radius);
        ctx.arcTo(p.x, p.y + p.h, p.x, p.y, p.radius);
        ctx.arcTo(p.x, p.y, p.x + p.w, p.y, p.radius);
        ctx.closePath();
        ctx.clip();

        // রেশিও না মিললে ব্লার ব্যাকগ্রাউন্ড
        ctx.save();
        ctx.filter = "blur(25px) brightness(0.85)";
        drawCoverImage(userImg, p.x, p.y, p.w, p.h);
        ctx.restore();

        // মেইন ইমেজ ফিটিং (Cover Logic)
        const imgRatio = userImg.width / userImg.height;
        const targetRatio = p.w / p.h;
        
        let baseW, baseH;
        if (imgRatio > targetRatio) {
            baseH = p.h;
            baseW = p.h * imgRatio;
        } else {
            baseW = p.w;
            baseH = p.w / imgRatio;
        }

        const finalW = baseW * s.scale;
        const finalH = baseH * s.scale;

        const drawX = p.x + (p.w - finalW) / 2 + s.offsetX;
        const drawY = p.y + (p.h - finalH) / 2 + s.offsetY;

        ctx.drawImage(userImg, drawX, drawY, finalW, finalH);
        ctx.restore();
    }

    function drawCoverImage(img, x, y, w, h) {
        const imgRatio = img.width / img.height;
        const targetRatio = w / h;
        let dW, dH, dX, dY;
        if (imgRatio > targetRatio) {
            dH = h; dW = img.width * (h / img.height);
            dX = x + (w - dW) / 2; dY = y;
        } else {
            dW = w; dH = img.height * (w / img.width);
            dX = x; dY = y + (h - dH) / 2;
        }
        ctx.drawImage(img, dX, dY, dW, dH);
    }

    function drawPostersText() {
        const name = document.getElementById('nameInput').value.trim();
        const designation = document.getElementById('designationInput').value.trim();
        const fontName = "'SolaimanLipi', 'Hind Siliguri', sans-serif";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        if (name) {
            const nBox = CONFIG.nameBox;
            let currentSize = 45 + settings.name.sizeOffset;
            ctx.font = `bold ${currentSize}px ${fontName}`;
            
            while (ctx.measureText(name).width > nBox.w - 40 && currentSize > 20) {
                currentSize -= 1;
                ctx.font = `bold ${currentSize}px ${fontName}`;
            }

            ctx.fillStyle = settings.name.color;
            const centerX = nBox.x + (nBox.w / 2) + settings.name.offsetX;
            const centerY = nBox.y + (nBox.h / 2) + settings.name.offsetY;
            ctx.fillText(name, centerX, centerY);
        }

        if (designation) {
            const nBox = CONFIG.nameBox;
            const dYOffset = CONFIG.designationBox.yOffset;
            let currentSize = 28 + settings.designation.sizeOffset;
            
            ctx.font = `500 ${currentSize}px ${fontName}`;
            while (ctx.measureText(designation).width > nBox.w - 40 && currentSize > 15) {
                currentSize -= 1;
                ctx.font = `500 ${currentSize}px ${fontName}`;
            }

            ctx.fillStyle = settings.designation.color;
            const centerX = nBox.x + (nBox.w / 2) + settings.designation.offsetX;
            const centerY = nBox.y + nBox.h + dYOffset + (currentSize/2) + settings.designation.offsetY;
            ctx.fillText(designation, centerX, centerY);
        }
    }

    function setActiveMode(m) {
        activeMode = m;
        document.getElementById('modeName').className = m === 'name' ? 'mode-btn active-mode' : 'mode-btn inactive-mode';
        document.getElementById('modeDesignation').className = m === 'designation' ? 'mode-btn active-mode' : 'mode-btn inactive-mode';
        document.getElementById('modePhoto').className = m === 'photo' ? 'mode-btn active-mode' : 'mode-btn inactive-mode';
        
        document.getElementById('resizeLabel').innerText = (m === 'photo') ? 'জুম / স্কেল' : 'ফন্ট সাইজ';
    }

    function moveElements(x, y) {
        settings[activeMode].offsetX += x;
        settings[activeMode].offsetY += y;
        render();
    }

    function resizeElements(val) {
        if (activeMode === 'photo') {
            settings.photo.scale += (val / 50);
            if (settings.photo.scale < 0.1) settings.photo.scale = 0.1;
        } else {
            settings[activeMode].sizeOffset += val;
        }
        render();
    }

    function resetSettings() {
        if (activeMode === 'photo') {
            settings.photo = { offsetX: 0, offsetY: 0, scale: 1.0 };
        } else {
            settings[activeMode].offsetX = 0;
            settings[activeMode].offsetY = 0;
            settings[activeMode].sizeOffset = 0;
        }
        render();
    }

    function downloadCard() {
        const link = document.createElement('a');
        link.download = 'Hatpakha_Poster.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
    }

    window.onload = initApp;
</script>
