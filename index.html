<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, updateDoc, increment, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCs7YVt4fPnddxq8qyO-J2WcAVhaWxZTAo",
        authDomain: "noakhali-4.firebaseapp.com",
        projectId: "noakhali-4",
        storageBucket: "noakhali-4.firebasestorage.app",
        messagingSenderId: "687665873364",
        appId: "1:687665873364:web:e84b00ad47ab3396ae5641",
        measurementId: "G-HMV2390JGG"
    };

    let db, auth;
    const appId = 'noakhali-4';

    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        // ১. আগে সাইন-ইন নিশ্চিত করা যাতে ডাটা রিড করা যায়
        signInAnonymously(auth).then(() => {
            console.log("Logged in anonymously");
        }).catch(err => console.error("Auth failed:", err));

        // ২. রিয়েল-টাইম লিসেনার (সর্বদা সচল থাকবে)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // পাথ: artifacts / appId / public / data / statistics / global_counts
                const statsRef = doc(db, 'artifacts', appId, 'public', 'data', 'statistics', 'global_counts');
                
                // রিয়েল-টাইম আপডেট শোনা (এটি পেজ লোড হওয়া মাত্রই রান হবে)
                onSnapshot(statsRef, (snap) => {
                    if (snap.exists()) {
                        const val = snap.data().downloadCount || 0;
                        updateCounterUI(val);
                    } else {
                        // যদি ডাটাবেসে ফাইলটি না থাকে তবে ০ দিয়ে তৈরি করবে
                        setDoc(statsRef, { downloadCount: 0 });
                        updateCounterUI(0);
                    }
                }, (error) => {
                    console.error("Firestore Listen Error:", error);
                });
            }
        });

    } catch (e) {
        console.error("Firebase Initialization Error:", e);
    }

    function updateCounterUI(val) {
        const enToBn = { '0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯' };
        const bnVal = val.toString().split('').map(d => enToBn[d] || d).join('');
        const el = document.getElementById('counterValue');
        if (el) el.innerText = bnVal;
    }

    // ডাউনলোড সংখ্যা বৃদ্ধির গ্লোবাল ফাংশন
    window.incrementGlobalDownload = async () => {
        if (auth && auth.currentUser) {
            const statsRef = doc(db, 'artifacts', appId, 'public', 'data', 'statistics', 'global_counts');
            try {
                await updateDoc(statsRef, { downloadCount: increment(1) });
            } catch (e) {
                console.error("Increment failed:", e);
            }
        }
    };
</script>

<script>
    const CONFIG = {
        size: 1080,
        photoArea: { w: 408, h: 408, x: 652, y: 652, radius: 32 },
        nameBox: { w: 611, h: 82, x: 28, y: 916 },
        designationBox: { yOffset: 16 }
    };

    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');
    let templateImg = new Image();
    let userImg = null;
    let activeMode = 'name';
    let isTemplateLoaded = false;

    const settings = {
        name: { offsetX: 0, offsetY: 0, sizeOffset: 0, color: '#FFFFFF', baseSize: 60 },
        designation: { offsetX: 0, offsetY: 0, sizeOffset: 0, color: '#000000', baseSize: 28 },
        photo: { offsetX: 0, offsetY: 0, scale: 1.0 }
    };

    function initApp() {
        canvas.width = CONFIG.size;
        canvas.height = CONFIG.size;
        templateImg.crossOrigin = "anonymous";
        const tSource = (typeof base64Template !== 'undefined' && base64Template.length > 100) 
            ? base64Template : 'https://i.imgur.com/jBCoTbX.jpg';
        templateImg.src = tSource;

        templateImg.onload = () => { isTemplateLoaded = true; render(); };
        templateImg.onerror = () => { isTemplateLoaded = false; render(); };

        document.getElementById('nameInput').addEventListener('input', render);
        document.getElementById('designationInput').addEventListener('input', render);
        document.getElementById('imageInput').addEventListener('change', handleImage);
    }

    function handleImage(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => { userImg = img; render(); };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    function render() {
        if (!ctx) return;
        ctx.clearRect(0, 0, CONFIG.size, CONFIG.size);
        
        if (isTemplateLoaded && templateImg.complete) {
            ctx.drawImage(templateImg, 0, 0, CONFIG.size, CONFIG.size);
        } else {
            ctx.fillStyle = "#f1f5f9"; ctx.fillRect(0, 0, CONFIG.size, CONFIG.size);
            ctx.fillStyle = "#94a3b8"; ctx.font = "40px sans-serif"; ctx.textAlign = "center";
            ctx.fillText("লোড হচ্ছে...", CONFIG.size/2, CONFIG.size/2);
        }

        if (userImg && userImg.complete && userImg.naturalWidth > 0) {
            drawUserPhoto();
        }
        
        drawPostersText();
    }

    function drawUserPhoto() {
        const p = CONFIG.photoArea;
        const s = settings.photo;
        const imgRatio = userImg.width / userImg.height;
        const targetRatio = p.w / p.h;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p.x + p.radius, p.y);
        ctx.arcTo(p.x + p.w, p.y, p.x + p.w, p.y + p.h, p.radius);
        ctx.arcTo(p.x + p.w, p.y + p.h, p.x, p.y + p.h, p.radius);
        ctx.arcTo(p.x, p.y + p.h, p.x, p.y, p.radius);
        ctx.arcTo(p.x, p.y, p.x + p.w, p.y, p.radius);
        ctx.closePath(); 
        ctx.clip();

        ctx.save();
        if (ctx.filter !== undefined) ctx.filter = "blur(20px) brightness(0.9)";
        let dW, dH, dX, dY;
        if (imgRatio > targetRatio) { dH = p.h; dW = userImg.width * (p.h / userImg.height); dX = p.x + (p.w - dW) / 2; dY = p.y; }
        else { dW = p.w; dH = userImg.height * (p.w / userImg.width); dX = p.x; dY = p.y + (p.h - dH) / 2; }
        ctx.drawImage(userImg, dX, dY, dW, dH);
        ctx.restore();

        let baseW, baseH;
        if (imgRatio > targetRatio) { baseH = p.h; baseW = p.h * imgRatio; }
        else { baseW = p.w; baseH = p.w / imgRatio; }
        const finalW = baseW * s.scale; const finalH = baseH * s.scale;
        ctx.drawImage(userImg, p.x + (p.w - finalW) / 2 + s.offsetX, p.y + (p.h - finalH) / 2 + s.offsetY, finalW, finalH);
        ctx.restore();
    }

    function drawPostersText() {
        const name = document.getElementById('nameInput').value.trim();
        const designation = document.getElementById('designationInput').value.trim();
        const fontName = "'SolaimanLipi', 'Hind Siliguri', sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";

        if (name) {
            let curS = settings.name.baseSize + settings.name.sizeOffset;
            ctx.font = `bold ${curS}px ${fontName}`;
            while (ctx.measureText(name).width > CONFIG.nameBox.w - 30 && curS > 10) { curS--; ctx.font = `bold ${curS}px ${fontName}`; }
            ctx.fillStyle = settings.name.color;
            ctx.fillText(name, CONFIG.nameBox.x + (CONFIG.nameBox.w/2) + settings.name.offsetX, CONFIG.nameBox.y + (CONFIG.nameBox.h/2) + settings.name.offsetY);
        }

        if (designation) {
            let curS = settings.designation.baseSize + settings.designation.sizeOffset;
            ctx.font = `500 ${curS}px ${fontName}`;
            const nBox = CONFIG.nameBox;
            while (ctx.measureText(designation).width > nBox.w - 30 && curS > 10) { curS--; ctx.font = `500 ${curS}px ${fontName}`; }
            ctx.fillStyle = settings.designation.color;
            ctx.fillText(designation, nBox.x + (nBox.w/2) + settings.designation.offsetX, nBox.y + nBox.h + CONFIG.designationBox.yOffset + (curS/2) + settings.designation.offsetY);
        }
    }

    function setActiveMode(m) {
        activeMode = m;
        document.getElementById('resizeLabel').innerText = (m === 'photo') ? 'জুম / স্কেল' : 'ফন্ট সাইজ';
        document.getElementById('modeName').className = m === 'name' ? 'mode-btn active-mode' : 'mode-btn inactive-mode';
        document.getElementById('modeDesignation').className = m === 'designation' ? 'mode-btn active-mode' : 'mode-btn inactive-mode';
        document.getElementById('modePhoto').className = m === 'photo' ? 'mode-btn active-mode' : 'mode-btn inactive-mode';
    }

    function moveElements(x, y) { settings[activeMode].offsetX += x; settings[activeMode].offsetY += y; render(); }
    function resizeElements(val) { if (activeMode === 'photo') { settings.photo.scale += (val / 50); if (settings.photo.scale < 0.1) settings.photo.scale = 0.1; } else { settings[activeMode].sizeOffset += val; } render(); }
    function resetSettings() { if (activeMode === 'photo') settings.photo = { offsetX: 0, offsetY: 0, scale: 1.0 }; else { settings[activeMode].offsetX = 0; settings[activeMode].offsetY = 0; settings[activeMode].sizeOffset = 0; } render(); }

    function downloadCard() {
        canvas.toBlob((blob) => {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = 'Poster.png'; link.href = url;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            if (window.incrementGlobalDownload) window.incrementGlobalDownload();
            setTimeout(() => URL.revokeObjectURL(url), 100);
        }, 'image/png', 1.0);
    }

    async function shareOnFacebook() {
        const name = document.getElementById('nameInput').value.trim();
        const caption = `নির্বাচনে হাতপাখা প্রতীকে ভোট দিন। ${name ? '- ' + name : ''}`;
        try {
            canvas.toBlob(async (blob) => {
                if (!blob) return;
                const file = new File([blob], "hatpakha_poster.png", { type: "image/png" });
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: 'নির্বাচনী পোস্টার', text: caption });
                } else { downloadCard(); }
            }, 'image/png');
        } catch (error) { downloadCard(); }
    }

    window.onload = initApp;
</script>
